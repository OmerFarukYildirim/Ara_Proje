apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: omerfarukyildirim/frontend-image:v9
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # EKLENEN KISIM: Resource Limits
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "150Mi" # Frontend hafif olduğu için 150MB yeterli
            cpu: "500m"
